<VirtualHost *:80>
    ServerName techstorepro.local
    ServerAdmin admin@techstorepro.local
    DocumentRoot "E:/Cricao-TI/sites/Site_lojaOniline"

    <Directory "E:/Cricao-TI/sites/Site_lojaOniline">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        
        # Seguranca
        php_flag display_errors off
        php_flag log_errors on
        php_value error_log "E:/Cricao-TI/sites/Site_lojaOniline/server/php_errors.log"
        
        # Limitar upload
        php_value upload_max_filesize 10M
        php_value post_max_size 12M
        
        # Sessao segura
        php_value session.save_path "E:/Cricao-TI/sites/Site_lojaOniline/server/sessions"
        php_flag session.cookie_httponly on
        php_flag session.use_only_cookies on
        php_value session.gc_maxlifetime 86400
        php_value session.cookie_lifetime 0
    </Directory>

    # Comprimir arquivos
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Cache
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"  
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
    </IfModule>

    ErrorLog "E:/Cricao-TI/sites/Site_lojaOniline/server/error.log"
    CustomLog "E:/Cricao-TI/sites/Site_lojaOniline/server/access.log" combined
</VirtualHost>

