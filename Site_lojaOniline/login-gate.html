<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Pro - Acesso</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C3CF5'/%3E%3Cpath d='M16 6L6 12v8l10 6 10-6v-8L16 6z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C3CF5;
            --primary-dark: #5228CC;
            --primary-light: #8B5CF6;
            --secondary: #E94560;
            --accent: #00D4AA;
            --dark: #0A0A1A;
            --dark-2: #12122A;
            --dark-3: #1A1A3E;
            --dark-4: #222250;
            --gray-100: #F0F0F5;
            --gray-200: #D4D4E0;
            --gray-300: #A0A0B8;
            --gray-400: #6B6B80;
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-hover: rgba(255, 255, 255, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--dark);
            color: var(--gray-100);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(600px circle at 20% 30%, rgba(108,60,245,0.08) 0%, transparent 70%),
                radial-gradient(500px circle at 80% 70%, rgba(233,69,96,0.06) 0%, transparent 70%),
                radial-gradient(400px circle at 50% 50%, rgba(0,212,170,0.04) 0%, transparent 70%);
        }
        .gate-container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }
        .gate-card {
            background: var(--dark-2);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.5);
            animation: fadeUp 0.6s ease-out;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .gate-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .gate-logo svg { width: 48px; height: 48px; }
        .gate-logo span {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gate-subtitle {
            text-align: center;
            color: var(--gray-400);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--gray-300);
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--glass-border);
            background: var(--dark);
            color: var(--gray-100);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(108,60,245,0.1);
            outline: none;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            border: none;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,60,245,0.35); }
        .btn-outline {
            border: 1.5px solid var(--glass-border);
            color: var(--gray-100);
            background: transparent;
        }
        .btn-outline:hover { border-color: var(--primary); background: rgba(108,60,245,0.1); }
        .btn-sm { padding: 8px 16px; font-size: 0.8rem; width: auto; }
        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--gray-400);
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }
        .info-bar {
            text-align: center;
            margin-top: 16px;
            font-size: 0.75rem;
            color: var(--gray-500);
        }
        .error-msg {
            color: var(--secondary);
            font-size: 0.8rem;
            margin-top: 8px;
            display: none;
        }
        @media (max-width: 480px) {
            .gate-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="gate-container">
        <div class="gate-card">
            <div class="gate-logo">
                <svg viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="url(#gGrad)"/>
                    <path d="M24 10l-10 6v12l10 6 10-6V16L24 10z" stroke="white" stroke-width="2.5" fill="none"/>
                    <circle cx="24" cy="24" r="5" fill="white"/>
                    <defs><linearGradient id="gGrad" x1="0" y1="0" x2="48" y2="48"><stop offset="0%" stop-color="#6C3CF5"/><stop offset="100%" stop-color="#E94560"/></linearGradient></defs>
                </svg>
                <span>TechStore</span>
            </div>
            <p class="gate-subtitle">Entre ou crie sua conta para acessar a loja</p>

            <div style="display:flex;gap:12px;margin-bottom:24px;">
                <button class="btn btn-primary" onclick="showTab('login')" id="tab-login-btn">Entrar</button>
                <button class="btn btn-outline" onclick="showTab('register')" id="tab-register-btn">Criar Conta</button>
            </div>

            <div id="login-form">
                <div class="form-group">
                    <label>Email ou Usuario</label>
                    <input type="text" id="login-user" placeholder="Digite seu email ou usuario" autofocus>
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="login-pass" placeholder="Digite sua senha">
                </div>
                <button class="btn btn-primary" onclick="handleGateLogin()">Entrar na Loja</button>
                <div class="error-msg" id="login-error"></div>
            </div>

            <div id="register-form" style="display:none;">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="reg-name" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="reg-pass" placeholder="Crie uma senha">
                </div>
                <button class="btn btn-primary" onclick="handleGateRegister()">Criar Conta e Entrar</button>
                <div class="error-msg" id="register-error"></div>
            </div>

            <div style="text-align:center;margin-top:16px;">
                <button onclick="fillAdminCreds();setTimeout(handleGateLogin,100)" style="background:none;border:none;color:var(--gray-500);font-size:0.7rem;cursor:pointer;transition:all 0.3s;padding:4px 8px;border-radius:4px;" title="Acesso restrito" onmouseover="this.style.color='var(--primary-light)'" onmouseout="this.style.color='var(--gray-500)'">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Admin
                </button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_USER = 'G7xK#pL9@mN2$qR5&wT8*zX1!cV4^bN6*eA3(yU7)jH0_kF9+dM2~fR6=gB1';
        const ADMIN_PASS = 'kL9#mN2$qR5&wT8*zX1!cV4^bN6*eA3)';

        function showTab(tab) {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');
            const loginBtn = document.getElementById('tab-login-btn');
            const registerBtn = document.getElementById('tab-register-btn');

            if (tab === 'login') {
                login.style.display = 'block';
                register.style.display = 'none';
                loginBtn.className = 'btn btn-primary';
                registerBtn.className = 'btn btn-outline';
            } else {
                login.style.display = 'none';
                register.style.display = 'block';
                loginBtn.className = 'btn btn-outline';
                registerBtn.className = 'btn btn-primary';
            }
        }

        function enterSite() {
            localStorage.setItem('auth_gate', 'true');
            localStorage.setItem('auth_gate_time', Date.now());
            window.location.href = 'index.html';
        }

        function handleGateLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const error = document.getElementById('login-error');

            if (!user || !pass) {
                error.textContent = 'Preencha usuario e senha';
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none';
            enterSite();
        }

        function handleGateRegister() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();
            const error = document.getElementById('register-error');

            if (!name || !email || !pass) {
                error.textContent = 'Preencha todos os campos';
                error.style.display = 'block';
                return;
            }

            error.style.display = 'none';

            let users = JSON.parse(localStorage.getItem('registered_users') || '[]');
            users.push({ id: Date.now(), nome: name, email: email, senha: btoa(pass), criado: new Date().toISOString() });
            localStorage.setItem('registered_users', JSON.stringify(users));

            enterSite();
        }

        function fillAdminCreds() {
            document.getElementById('login-user').value = ADMIN_USER;
            document.getElementById('login-pass').value = ADMIN_PASS;
            document.getElementById('login-error').style.display = 'none';
            showTab('login');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-pass').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleGateLogin();
            });
            document.getElementById('reg-pass').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleGateRegister();
            });
        });
    </script>
</body>
</html>
