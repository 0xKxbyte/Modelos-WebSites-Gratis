<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TechStore Pro</title>
    <script>if(!localStorage.getItem('auth_gate')){window.location.href='../login-gate.html'}</script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C3CF5'/%3E%3Cpath d='M16 6L6 12v8l10 6 10-6v-8L16 6z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header class="header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="url(#logoGrad)"/><path d="M20 8L10 14v12l10 6 10-6V14L20 8z" stroke="white" stroke-width="2.5" fill="none"/><circle cx="20" cy="20" r="5" fill="white"/><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#6C3CF5"/><stop offset="100%" stop-color="#E94560"/></linearGradient></defs></svg>
                <span>TechStore</span>
            </a>
        </div>
    </header>

    <div class="cart-page">
        <div class="container" style="max-width: 800px;">
            <h1 class="section-title gradient-text" style="margin-bottom: 40px;">Finalizar Pedido</h1>
            <div class="auth-card" style="max-width:100%;">
                <form onsubmit="handleCheckout(event)">
                    <div class="form-group">
                        <label>CEP de Entrega</label>
                        <input type="text" id="checkout-cep" placeholder="00000-000" required maxlength="9" oninput="this.value=this.value.replace(/\D/g,'').replace(/^(\d{5})(\d)/,'$1-$2')">
                    </div>
                    <div class="form-group">
                        <label>Endereco</label>
                        <input type="text" id="checkout-endereco" placeholder="Rua, numero, complemento" required>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="checkout-cidade" placeholder="Cidade" required>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select id="checkout-estado" style="width:100%;padding:14px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--glass-border);background:var(--dark);color:var(--gray-100);">
                                <option value="">Selecione</option>
                                <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option><option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option><option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option><option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option><option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option><option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option><option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option><option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option><option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Metodo de Pagamento</label>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;">
                            <label style="display:flex;align-items:center;gap:8px;padding:12px;border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);cursor:pointer;">
                                <input type="radio" name="pagamento" value="credito" checked> Cartao de Credito
                            </label>
                            <label style="display:flex;align-items:center;gap:8px;padding:12px;border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);cursor:pointer;">
                                <input type="radio" name="pagamento" value="pix"> PIX
                            </label>
                            <label style="display:flex;align-items:center;gap:8px;padding:12px;border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);cursor:pointer;">
                                <input type="radio" name="pagamento" value="boleto"> Boleto
                            </label>
                            <label style="display:flex;align-items:center;gap:8px;padding:12px;border:1.5px solid var(--glass-border);border-radius:var(--radius-sm);cursor:pointer;">
                                <input type="radio" name="pagamento" value="mercado_pago"> Mercado Pago
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:16px;">Finalizar Pedido</button>
                </form>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script>
        function handleCheckout(e) {
            e.preventDefault();
            if (!Auth.isLoggedIn()) {
                Toast.show('Faca login para finalizar a compra', 'error');
                setTimeout(() => window.location.href = 'login.html', 1000);
                return;
            }
            const cep = document.getElementById('checkout-cep').value;
            const endereco = document.getElementById('checkout-endereco').value;
            const cidade = document.getElementById('checkout-cidade').value;
            const estado = document.getElementById('checkout-estado').value;
            const pagamento = document.querySelector('input[name="pagamento"]:checked').value;

            Toast.show('Pedido realizado com sucesso! Codigo: PED-' + Math.random().toString(36).substring(2, 8).toUpperCase(), 'success');
            localStorage.removeItem('cart_items');
            setTimeout(() => window.location.href = '../index.html', 2000);
        }
    </script>
</body>
</html>
