<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - TechStore Pro</title>
    <script>if(!localStorage.getItem('auth_gate')){window.location.href='../login-gate.html'}</script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C3CF5'/%3E%3Cpath d='M16 6L6 12v8l10 6 10-6v-8L16 6z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header class="header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="url(#logoGrad)"/><path d="M20 8L10 14v12l10 6 10-6V14L20 8z" stroke="white" stroke-width="2.5" fill="none"/><circle cx="20" cy="20" r="5" fill="white"/><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#6C3CF5"/><stop offset="100%" stop-color="#E94560"/></linearGradient></defs></svg>
                <span>TechStore</span>
            </a>
        </div>
    </header>

    <div class="cart-page">
        <div class="container">
            <h1 class="section-title gradient-text" style="margin-bottom: 40px;">Meus Favoritos</h1>
            <div class="products-grid" id="favorites-grid"></div>
            <div id="favorites-empty" style="display:none; text-align:center; padding:80px 20px;">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="1" style="margin-bottom:16px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <h3 style="color:var(--gray-300);margin-bottom:8px;">Nenhum favorito ainda</h3>
                <p style="color:var(--gray-400);margin-bottom:24px;">Adicione produtos aos favoritos para ve-los aqui</p>
                <a href="../index.html" class="btn btn-primary">Ver Produtos</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/favorites.js"></script>
    <script>
        const ALL_PRODUCTS = [
            { id: 1, nome: 'PC Gamer Titan X', slug: 'pc-gamer-titan-x', descricao: 'PC Gamer de alta performance', preco: 15999.99, preco_promocional: 13999.99, imagens: ['https://placehold.co/280x280/1a1a2e/e94560?text=PC+Gamer'] },
            { id: 2, nome: 'PC Workstation Pro', slug: 'pc-workstation-pro', descricao: 'Workstation profissional', preco: 21999.99, preco_promocional: 19999.99, imagens: ['https://placehold.co/280x280/16213e/0f3460?text=Workstation'] },
            { id: 3, nome: 'Notebook UltraBook Pro 15', slug: 'notebook-ultrabook-pro-15', descricao: 'Notebook ultrafino 4K OLED', preco: 8499.99, preco_promocional: 7799.99, imagens: ['https://placehold.co/280x280/0f3460/e94560?text=UltraBook'] },
            { id: 4, nome: 'RTX 5090 Phantom', slug: 'rtx-5090-phantom', descricao: 'Placa de video RTX 5090', preco: 12999.99, preco_promocional: 11999.99, imagens: ['https://placehold.co/280x280/e94560/1a1a2e?text=RTX+5090'] },
            { id: 5, nome: 'Intel Core i9-14900K', slug: 'intel-core-i9-14900k', descricao: 'Processador 24 nucleos', preco: 4299.99, preco_promocional: 3899.99, imagens: ['https://placehold.co/280x280/1a1a2e/0f3460?text=i9-14900K'] },
            { id: 6, nome: 'Teclado Mecanico RGB Phantom', slug: 'teclado-mecanico-rgb-phantom', descricao: 'Teclado mecanico Cherry MX', preco: 599.99, preco_promocional: 499.99, imagens: ['https://placehold.co/280x280/16213e/e94560?text=Teclado'] },
            { id: 7, nome: 'Mouse Gamer Pro X', slug: 'mouse-gamer-pro-x', descricao: 'Mouse sem fio 32K DPI', preco: 399.99, preco_promocional: 349.99, imagens: ['https://placehold.co/280x280/e94560/16213e?text=Mouse+Pro+X'] },
            { id: 8, nome: 'Smartphone Galaxy Ultra 25', slug: 'smartphone-galaxy-ultra-25', descricao: 'Smartphone 6.9 AMOLED', preco: 7999.99, preco_promocional: 7299.99, imagens: ['https://placehold.co/280x280/0f3460/1a1a2e?text=Galaxy+Ultra'] },
        ];

        function loadFavorites() {
            const grid = document.getElementById('favorites-grid');
            const empty = document.getElementById('favorites-empty');
            const favIds = Favorites.getAll();

            if (favIds.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            const products = ALL_PRODUCTS.filter(p => favIds.includes(p.id));
            if (products.length === 0) {
                grid.style.display = 'none';
                empty.style.display = 'block';
                return;
            }

            grid.innerHTML = products.map(p => {
                const price = p.preco_promocional || p.preco;
                return `
                    <div class="product-card" data-id="${p.id}">
                        <div class="product-image">
                            <img src="${p.imagens[0]}" alt="${p.nome}">
                            <div class="product-actions">
                                <button class="fav-btn active" data-id="${p.id}" onclick="Favorites.toggle(${p.id}); this.closest('.product-card').remove(); if(Favorites.getAll().length===0){document.getElementById('favorites-grid').style.display='none';document.getElementById('favorites-empty').style.display='block';}">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="product-info">
                            <a href="product.html?slug=${p.slug}"><h3>${p.nome}</h3></a>
                            <p class="product-desc">${p.descricao}</p>
                            <div class="product-price-row">
                                <div class="product-price">
                                    <span class="current-price">R$ ${price.toFixed(2).replace('.', ',')}</span>
                                </div>
                                <button class="btn-buy" onclick="Cart.add(${p.id})">Comprar</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', loadFavorites);
    </script>
    <script src="../assets/js/cart.js"></script>
</body>
</html>
