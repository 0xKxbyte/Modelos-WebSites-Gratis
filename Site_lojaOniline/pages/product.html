<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto - TechStore Pro</title>
    <script>if(!localStorage.getItem('auth_gate')){window.location.href='../login-gate.html'}</script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C3CF5'/%3E%3Cpath d='M16 6L6 12v8l10 6 10-6v-8L16 6z' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/animations.css">
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header class="header">
        <div class="container header-inner">
            <a href="../index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="10" fill="url(#logoGrad)"/><path d="M20 8L10 14v12l10 6 10-6V14L20 8z" stroke="white" stroke-width="2.5" fill="none"/><circle cx="20" cy="20" r="5" fill="white"/><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40"><stop offset="0%" stop-color="#6C3CF5"/><stop offset="100%" stop-color="#E94560"/></linearGradient></defs></svg>
                <span>TechStore</span>
            </a>
            <div style="flex:1;"></div>
            <div class="header-actions">
                <button class="action-btn" onclick="window.location.href='favorites.html'">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
                <button class="action-btn" onclick="window.location.href='cart.html'">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="badge cart-badge" style="display:none;">0</span>
                </button>
                <button class="action-btn" id="user-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="product-page" id="product-page">
        <div class="container">
            <div id="product-loading" style="padding: 100px 0; text-align: center;">
                <div class="loading-spinner"></div>
                <p style="color: var(--gray-400); margin-top: 16px;">Carregando produto...</p>
            </div>
            <div id="product-content" style="display:none;"></div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/favorites.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script>
        const ALL_PRODUCTS = [
            { id: 1, nome: 'PC Gamer Titan X', slug: 'pc-gamer-titan-x', descricao: 'PC Gamer de alta performance com Intel Core i9-14900K, 32GB DDR5, RTX 4090, SSD 1TB NVMe. Ideal para jogos pesados e renderizacao profissional.', categoria: 'Computadores', preco: 15999.99, preco_promocional: 13999.99, parcelas: 12, imagens: ['https://placehold.co/600x400/1a1a2e/e94560?text=PC+Gamer+Titan+X','https://placehold.co/600x400/1a1a2e/16213e?text=PC+Titan+X+Frente','https://placehold.co/600x400/1a1a2e/0f3460?text=PC+Titan+X+Traseira'], especificacoes: {Processador:'Intel Core i9-14900K',RAM:'32GB DDR5',GPU:'RTX 4090 24GB',Armazenamento:'1TB NVMe SSD',Fonte:'850W 80 Plus Gold',Placa_Mae:'Z790 DDR5'} },
            { id: 2, nome: 'PC Workstation Pro', slug: 'pc-workstation-pro', descricao: 'Workstation profissional para design, edicao de video e modelagem 3D.', categoria: 'Computadores', preco: 21999.99, preco_promocional: 19999.99, parcelas: 12, imagens: ['https://placehold.co/600x400/16213e/0f3460?text=Workstation+Pro','https://placehold.co/600x400/16213e/e94560?text=Workstation+Frente'], especificacoes: {Processador:'AMD Ryzen 9 7950X',RAM:'64GB DDR5',GPU:'RTX 4080 16GB',Armazenamento:'2TB NVMe SSD',Fonte:'1000W 80 Plus Platinum'} },
            { id: 3, nome: 'Notebook UltraBook Pro 15', slug: 'notebook-ultrabook-pro-15', descricao: 'Notebook ultrafino com tela 15.6 4K OLED.', categoria: 'Notebooks', preco: 8499.99, preco_promocional: 7799.99, parcelas: 12, imagens: ['https://placehold.co/600x400/0f3460/e94560?text=UltraBook+Pro','https://placehold.co/600x400/0f3460/16213e?text=UltraBook+Aberto'], especificacoes: {Processador:'Intel Core i7-13700H',RAM:'16GB LPDDR5',Tela:'15.6 4K OLED',Armazenamento:'512GB NVMe SSD',Bateria:'8 horas',Peso:'1.8kg'} },
            { id: 4, nome: 'RTX 5090 Phantom', slug: 'rtx-5090-phantom', descricao: 'Placa de video NVIDIA GeForce RTX 5090 32GB GDDR7.', categoria: 'Hardware', preco: 12999.99, preco_promocional: 11999.99, parcelas: 12, imagens: ['https://placehold.co/600x400/e94560/1a1a2e?text=RTX+5090','https://placehold.co/600x400/e94560/16213e?text=RTX+5090+Lateral'], especificacoes: {GPU:'NVIDIA RTX 5090',VRAM:'32GB GDDR7',Clock:'2.9GHz Boost',TDP:'450W',Saidas:'3x DP 2.1, 1x HDMI 2.1'} },
            { id: 5, nome: 'Intel Core i9-14900K', slug: 'intel-core-i9-14900k', descricao: 'Processador Intel Core i9-14900K, 24 nucleos.', categoria: 'Hardware', preco: 4299.99, preco_promocional: 3899.99, parcelas: 10, imagens: ['https://placehold.co/600x400/1a1a2e/0f3460?text=i9-14900K','https://placehold.co/600x400/1a1a2e/e94560?text=i9+Caixa'], especificacoes: {Nucleos:'24 (8P + 16E)',Threads:'32',Turbo:'6.0GHz',Socket:'LGA1700',TDP:'125W (253W Turbo)'} },
            { id: 6, nome: 'Teclado Mecanico RGB Phantom', slug: 'teclado-mecanico-rgb-phantom', descricao: 'Teclado mecanico Cherry MX Blue.', categoria: 'Perifericos', preco: 599.99, preco_promocional: 499.99, parcelas: 6, imagens: ['https://placehold.co/600x400/16213e/e94560?text=Teclado+Phantom','https://placehold.co/600x400/16213e/0f3460?text=Teclado+RGB'], especificacoes: {Switch:'Cherry MX Blue',Layout:'Full Size',RGB:'Por tecla',Material:'Aluminio escovado',Conexao:'USB-C'} },
            { id: 7, nome: 'Mouse Gamer Pro X', slug: 'mouse-gamer-pro-x', descricao: 'Mouse gamer sem fio 32K DPI.', categoria: 'Perifericos', preco: 399.99, preco_promocional: 349.99, parcelas: 6, imagens: ['https://placehold.co/600x400/e94560/1a1a2e?text=Mouse+Pro+X','https://placehold.co/600x400/e94560/16213e?text=Mouse+Lateral'], especificacoes: {Sensor:'Optical 32K DPI',Botoes:'8 programaveis',Conexao:'2.4GHz / Bluetooth 5.0',Bateria:'70 horas',Peso:'58g'} },
            { id: 8, nome: 'Smartphone Galaxy Ultra 25', slug: 'smartphone-galaxy-ultra-25', descricao: 'Smartphone 6.9 Dynamic AMOLED.', categoria: 'Celulares', preco: 7999.99, preco_promocional: 7299.99, parcelas: 12, imagens: ['https://placehold.co/600x400/0f3460/1a1a2e?text=Galaxy+Ultra','https://placehold.co/600x400/0f3460/e94560?text=Galaxy+Traseira'], especificacoes: {Tela:'6.9 Dynamic AMOLED 2X',Armazenamento:'512GB',Camera:'200MP + 50MP + 12MP',RAM:'12GB',Bateria:'5000mAh'} },
            { id: 11, nome: 'Monitor 32 4K HDR1000', slug: 'monitor-32-4k-hdr1000', descricao: 'Monitor 32 4K UHD IPS, HDR1000, 144Hz.', categoria: 'Monitores', preco: 4999.99, preco_promocional: 4499.99, parcelas: 12, imagens: ['https://placehold.co/600x400/1a1a2e/e94560?text=Monitor+32+4K','https://placehold.co/600x400/1a1a2e/16213e?text=Monitor+Tela'], especificacoes: {Tamanho:'32',Resolucao:'4K UHD',Painel:'IPS',HDR:'HDR1000',Taxa:'144Hz',Tempo:'1ms'} },
            { id: 12, nome: 'SSD NVMe 2TB SpeedForce', slug: 'ssd-nvme-2tb-speedforce', descricao: 'SSD NVMe PCIe 5.0, leitura 12.000MB/s.', categoria: 'Hardware', preco: 1599.99, preco_promocional: 1399.99, parcelas: 8, imagens: ['https://placehold.co/600x400/0f3460/e94560?text=SSD+2TB','https://placehold.co/600x400/0f3460/1a1a2e?text=SSD+NVMe'], especificacoes: {Capacidade:'2TB',Interface:'PCIe 5.0 NVMe',Leitura:'12.000MB/s',Gravacao:'10.000MB/s',Formato:'M.2 2280'} }
        ];

        function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const container = document.getElementById('product-content');
            const loading = document.getElementById('product-loading');

            const product = ALL_PRODUCTS.find(p => p.slug === slug);
            if (!product) {
                loading.style.display = 'none';
                container.style.display = 'block';
                container.innerHTML = '<div style="text-align:center;padding:100px 0;"><h2>Produto nao encontrado</h2><a href="../index.html" class="btn btn-primary" style="margin-top:20px;">Voltar</a></div>';
                return;
            }

            loading.style.display = 'none';
            container.style.display = 'block';

            const price = product.preco_promocional || product.preco;
            const oldPrice = product.preco_promocional ? product.preco : null;
            const economia = product.preco_promocional ? product.preco - product.preco_promocional : 0;
            const parcela = (price / product.parcelas).toFixed(2);
            const img = product.imagens[0];

            container.innerHTML = `
                <div class="product-detail">
                    <div class="product-gallery reveal-left">
                        <div class="main-image">
                            <img src="${img}" alt="${product.nome}" id="main-image">
                        </div>
                        <div class="thumbnails">
                            ${product.imagens.map((i, idx) => `
                                <div class="thumb ${idx === 0 ? 'active' : ''}" onclick="changeImage(this, '${i}')">
                                    <img src="${i}" alt="">
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="product-info-detail reveal-right">
                        <div class="product-breadcrumb">
                            <a href="../index.html">Home</a>
                            <span>/</span>
                            <a href="search.html?cat=${product.categoria.toLowerCase()}">${product.categoria}</a>
                            <span>/</span>
                            <span>${product.nome}</span>
                        </div>
                        <h1>${product.nome}</h1>
                        <div class="product-rating">
                            <div class="stars">${'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'.repeat(5)}</div>
                            <span>4.9 (128 avaliacoes)</span>
                        </div>

                        <div class="product-price-box">
                            <div class="price-row">
                                <span class="current-price">R$ ${price.toFixed(2).replace('.', ',')}</span>
                                ${oldPrice ? `<span class="old-price">R$ ${oldPrice.toFixed(2).replace('.', ',')}</span>` : ''}
                            </div>
                            <div class="installments">${product.parcelas}x de R$ ${parcela.replace('.', ',')} sem juros</div>
                            ${economia > 0 ? `<div class="economy"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Economia de R$ ${economia.toFixed(2).replace('.', ',')}</div>` : ''}
                        </div>

                        <p class="product-description">${product.descricao}</p>

                        <div class="product-specs">
                            ${Object.entries(product.especificacoes || {}).map(([key, val]) => `
                                <div class="spec-item">
                                    <span class="spec-label">${key.replace(/_/g, ' ')}</span>
                                    <span class="spec-value">${val}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="product-quantity">
                            <label>Quantidade:</label>
                            <div class="qty-control">
                                <button onclick="changeQty(-1)">-</button>
                                <input type="text" id="product-qty" value="1" readonly>
                                <button onclick="changeQty(1)">+</button>
                            </div>
                        </div>

                        <div class="product-actions-lg">
                            <button class="btn btn-primary btn-lg" onclick="Cart.add(${product.id}, parseInt(document.getElementById('product-qty').value))">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                                Adicionar ao Carrinho
                            </button>
                            <button class="btn btn-secondary btn-lg" onclick="buyNow(${product.id})">Comprar Agora</button>
                            <button class="btn btn-outline btn-lg" onclick="shareProduct()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                            </button>
                        </div>

                        <div class="shipping-calc">
                            <h4><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Calcular Frete</h4>
                            <div class="shipping-input">
                                <input type="text" id="freight-cep-product" placeholder="Digite seu CEP" maxlength="9" oninput="this.value=this.value.replace(/\D/g,'').replace(/^(\d{5})(\d)/,'$1-$2')">
                                <button class="btn btn-primary" onclick="Freight.calculate()">Calcular</button>
                            </div>
                            <div id="freight-result-product"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function changeImage(thumb, src) {
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
            document.getElementById('main-image').src = src;
        }

        let currentQty = 1;
        function changeQty(delta) {
            currentQty = Math.max(1, currentQty + delta);
            document.getElementById('product-qty').value = currentQty;
        }

        function buyNow(productId) {
            Cart.add(productId, currentQty);
            setTimeout(() => window.location.href = 'cart.html', 500);
        }

        function shareProduct() {
            if (navigator.share) {
                navigator.share({ title: document.title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                Toast.show('Link copiado para a area de transferencia!', 'success');
            }
        }

        const Freight = {
            calculate() {
                const cep = document.getElementById('freight-cep-product').value.replace(/\D/g, '');
                const result = document.getElementById('freight-result-product');
                if (cep.length !== 8) { Toast.show('Digite um CEP valido', 'error'); return; }
                result.innerHTML = '<div class="loading-spinner" style="margin:16px auto;"></div>';
                const frete = [
                    { servico: 'Sedex', prazo: Math.round(Math.random() * 3 + 1), valor: Math.round(Math.random() * 40 + 15) },
                    { servico: 'PAC', prazo: Math.round(Math.random() * 8 + 3), valor: Math.round(Math.random() * 25 + 8) }
                ];
                result.innerHTML = frete.map(f => `
                    <div class="frete-option">
                        <span>${f.servico} - ${f.prazo} dia(s) uteis</span>
                        <span style="font-weight:700;color:var(--accent);">R$ ${f.valor.toFixed(2).replace('.', ',')}</span>
                    </div>
                `).join('');
            }
        };

        document.addEventListener('DOMContentLoaded', loadProduct);
    </script>
</body>
</html>
